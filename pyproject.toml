[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enjin-triage"
version = "0.1.0"
description = "Reads the bug reports the TEGE editor files on GitHub, groups duplicates, and investigates them through the editor's MCP server."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.80",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
enjin-triage = "triage.cli:main"

[tool.setuptools.packages.find]
include = ["triage*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF", "PLW"]
ignore = ["RUF012"]

[tool.pytest.ini_options]
testpaths = ["tests"]
